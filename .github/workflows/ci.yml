name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run build
        run: npm run build

      - name: Check the declared nodes were built
        run: node -e "const p = require('./package.json'); const fs = require('fs'); const missing = p.n8n.nodes.filter((f) => !fs.existsSync(f)); if (missing.length) { console.error('declared but not built:', missing); process.exit(1); }"

      - name: Check the package has no runtime dependency
        run: node -e "const p = require('./package.json'); if (p.dependencies && Object.keys(p.dependencies).length) { console.error('package.json declares dependencies:', p.dependencies); process.exit(1); }"
