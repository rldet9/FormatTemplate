name: Release

# Publishes to npm with a provenance attestation when a version tag is pushed.
# Authentication: the repository secret NPM_TOKEN, a granular npm token with write
# access to this package only, created with "Bypass 2FA". Granular write tokens
# expire after 90 days at most: the first step fails early when it has.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Check the npm token
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if ! npm whoami; then
            echo "::error::The NPM_TOKEN secret is missing, revoked or expired. Create a new granular token on npmjs.com (write access to this package, Bypass 2FA) and update the repository secret."
            exit 1
          fi

      - name: Check the tag matches the package version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Run build
        run: npm run build

      - name: Check the declared nodes were built
        run: node -e "const p = require('./package.json'); const fs = require('fs'); const missing = p.n8n.nodes.filter((f) => !fs.existsSync(f)); if (missing.length) { console.error('declared but not built:', missing); process.exit(1); }"

      - name: Publish with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # `prepublishOnly` runs `n8n-node prerelease`, which refuses a publish without it.
          RELEASE_MODE: 'true'
        run: npm publish --provenance --access public
