<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128"
     xmlns="http://www.w3.org/2000/svg" role="img"
     aria-labelledby="title desc">
  <title id="title">Logo FormatTemplate n8n</title>
  <desc id="desc">Carré orange n8n avec texte {#}</desc>

  <!-- Bloc principal n8n -->
  <rect x="0" y="0" width="128" height="128" rx="24" fill="#FF6533"/>

  <!-- Texte {#} centré -->
  <text x="64" y="64" text-anchor="middle" dominant-baseline="middle"
        font-family="Courier New, monospace"
        font-size="64" font-weight="700"
        fill="#ffffff">
    <tspan>{#}</tspan>
  </text>
</svg>